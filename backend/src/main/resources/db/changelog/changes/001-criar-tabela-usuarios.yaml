databaseChangeLog:
  - changeSet:
      id: 001-criar-tabela-usuarios
      author: cleverton
      changes:
        - createTable:
            tableName: usuarios
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_usuarios
              - column:
                  name: nome
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: senha_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: usuarios
            columnNames: email
            constraintName: uk_usuarios_email