databaseChangeLog:
  - changeSet:
      id: 007-criar-tabela-faturas
      author: cleverton
      changes:
        - createTable:
            tableName: faturas
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: usuario_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: descricao
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: valor
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: data_vencimento
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: paga
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: criada_em
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: atualizada_em
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: faturas
            baseColumnNames: usuario_id
            referencedTableName: usuarios
            referencedColumnNames: id
            constraintName: fk_faturas_usuario
        - createIndex:
            tableName: faturas
            indexName: idx_faturas_usuario_data_vencimento
            columns:
              - column:
                  name: usuario_id
              - column:
                  name: data_vencimento
