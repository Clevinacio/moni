name: Moni CI - Build & Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6 # Garante que as mensagens seguem o padrão

  # Validação do Backend (Java 25 + Spring Boot 4.0.3)
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Test Backend
        run: |
          cd backend
          ./gradlew clean build --no-daemon # Executa build e testes unitários

  # Validação do Frontend (Angular 21 + Node 22)
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Install and Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build -- --configuration production # Garante que o build de prod está íntegro

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --watch=false # Executa testes em modo headless