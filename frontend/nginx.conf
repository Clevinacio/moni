server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Configuração para suportar rotas do Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para evitar problemas de CORS em teste local
    location /api/ {
        proxy_pass http://moni-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Otimização para arquivos estáticos (Performance RNF08)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Página de erro customizada para acessibilidade
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}