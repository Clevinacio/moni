<section
  aria-labelledby="titulo-painel"
  class="mx-auto w-full max-w-2xl rounded-2xl border border-brand-light/50 bg-white p-6 shadow-[0_10px_30px_rgba(53,88,114,0.08)]"
>
  <p class="m-0 text-xs font-bold uppercase tracking-[0.08em] text-brand">Moni</p>
  <h2 id="titulo-painel" class="mt-1 text-[clamp(1.4rem,3vw,1.8rem)] font-semibold text-brand-dark">
    Area autenticada
  </h2>
  <p class="m-0 text-sm leading-relaxed text-brand-dark/75">
    Esta tela confirma que o login foi concluido. As proximas RFs adicionarao dashboard, transacoes
    e notificacoes.
  </p>

  @if (temSessao()) {
    <p
      class="my-4 rounded-lg border border-brand-light bg-background px-3 py-2 text-sm font-semibold text-brand-dark"
      role="status"
      aria-live="polite"
    >
      Sessao ativa para {{ descricaoSessao() }}.
    </p>
  }

  <a
    href="/auth/login"
    (click)="sair()"
    class="inline-flex rounded-lg bg-brand-dark px-4 py-2 text-sm font-semibold text-background hover:brightness-110"
  >
    Sair
  </a>
</section>
