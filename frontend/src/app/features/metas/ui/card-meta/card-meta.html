<article class="rounded-2xl border border-brand-light/40 bg-background/70 p-4">
    <header class="flex items-start justify-between gap-3">
        <div>
            <h3 class="m-0 text-2xl font-semibold text-brand-dark">{{ meta.nome }}</h3>
            <p class="m-0 mt-1 text-xs font-semibold uppercase tracking-[0.09em] text-brand-dark/65">
                Progresso da meta
            </p>
        </div>

        <span class="inline-flex rounded-full bg-success/20 px-3 py-1 text-xs font-semibold text-success">
            {{ percentual() }}%
        </span>
    </header>

    <div class="mt-3 h-2 rounded-full bg-brand-light/25">
        <div class="h-full rounded-full bg-brand-dark transition-all duration-300" [style.width.%]="percentual()"></div>
    </div>

    <div class="mt-4 grid grid-cols-2 gap-3 text-sm text-brand-dark">
        <div>
            <p class="m-0 text-[11px] font-semibold uppercase tracking-[0.1em] text-brand-dark/60">Poupado</p>
            <p class="m-0 mt-1 text-lg font-semibold">{{ meta.valorPoupado | currency: 'BRL' }}</p>
        </div>
        <div class="text-right">
            <p class="m-0 text-[11px] font-semibold uppercase tracking-[0.1em] text-brand-dark/60">Objetivo</p>
            <p class="m-0 mt-1 text-lg font-semibold">{{ meta.valorAlvo | currency: 'BRL' }}</p>
        </div>
    </div>

    <footer class="mt-4 flex gap-2">
        <button type="button" (click)="onEditar()"
            class="inline-flex min-h-11 flex-1 items-center justify-center rounded-xl border border-brand-light px-3 py-2 text-sm font-semibold text-brand-dark transition hover:bg-brand-light/20 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand">
            Editar
        </button>
        <button type="button" (click)="onExcluir()"
            class="inline-flex min-h-11 flex-1 items-center justify-center rounded-xl border border-error/35 px-3 py-2 text-sm font-semibold text-error transition hover:bg-error/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-error">
            Excluir
        </button>
    </footer>
</article>
