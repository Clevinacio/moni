<form [formGroup]="formulario" (ngSubmit)="onSalvar()" novalidate class="grid gap-4">
    <div class="grid gap-4 md:grid-cols-2">
        <app-input-formulario id="meta-nome" rotulo="Nome da meta" ajuda="Use um nome descritivo para seu objetivo."
            [invalido]="campoInvalido('nome')" [controle]="formulario.controls.nome" [mensagensErro]="{
				required: 'Nome é obrigatório.',
				maxlength: 'Nome deve ter no máximo 120 caracteres.'
			}" />

        <app-input-formulario id="meta-valor" rotulo="Valor alvo" tipo="text" [mascaraMoeda]="true"
            ajuda="Informe um valor maior que zero." [invalido]="campoInvalido('valorAlvo')"
            [controle]="formulario.controls.valorAlvo" [mensagensErro]="{
				required: 'Valor alvo é obrigatório.',
				min: 'Valor alvo deve ser maior que zero.'
			}" />
    </div>

    <div class="flex flex-wrap gap-2">
        <app-botao-submit [rotuloPadrao]="emEdicao ? 'Salvar alterações' : 'Criar meta'" rotuloCarregando="Salvando..."
            [carregando]="carregando" [desabilitado]="formulario.invalid" />

        <button type="button" (click)="onCancelar()"
            class="inline-flex min-h-11 items-center justify-center rounded-xl border border-brand-light px-4 py-2 text-sm font-semibold text-brand-dark transition hover:bg-brand-light/25 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand">
            Cancelar
        </button>
    </div>
</form>
