<section aria-label="Filtros de transações"
    class="grid gap-4 rounded-xl border border-brand-light/60 bg-background/60 p-4">
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 md:grid-cols-[1fr_1fr_auto] md:items-end">
        <div class="grid gap-1.5">
            <label for="dataInicioFiltro" class="text-sm font-semibold text-brand-dark">Data início</label>
            <input id="dataInicioFiltro" type="date" [(ngModel)]="dataInicio" [ngModelOptions]="{ standalone: true }"
                class="min-h-11 rounded-xl border border-brand-light bg-white px-3 py-2.5 text-brand-dark focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand" />
        </div>

        <div class="grid gap-1.5">
            <label for="dataFimFiltro" class="text-sm font-semibold text-brand-dark">Data fim</label>
            <input id="dataFimFiltro" type="date" [(ngModel)]="dataFim" [ngModelOptions]="{ standalone: true }"
                class="min-h-11 rounded-xl border border-brand-light bg-white px-3 py-2.5 text-brand-dark focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand" />
        </div>

        <button type="button" [disabled]="carregando" (click)="aplicarPeriodo()" aria-label="Filtrar por período"
            class="min-h-11 rounded-xl border border-brand-dark bg-brand-dark px-4 py-2 text-sm font-semibold text-white transition hover:brightness-105 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand disabled:cursor-not-allowed disabled:opacity-70 sm:col-span-2 md:col-span-1">
            Filtrar período
        </button>
    </div>

    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-[1fr_1fr_auto_auto] md:items-end">
        <div class="grid gap-1.5">
            <label for="mesFiltro" class="text-sm font-semibold text-brand-dark">Mês</label>
            <input id="mesFiltro" type="number" min="1" max="12" [(ngModel)]="mes"
                [ngModelOptions]="{ standalone: true }"
                class="min-h-11 rounded-xl border border-brand-light bg-white px-3 py-2.5 text-brand-dark focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand" />
        </div>

        <div class="grid gap-1.5">
            <label for="anoFiltro" class="text-sm font-semibold text-brand-dark">Ano</label>
            <input id="anoFiltro" type="number" min="2000" [(ngModel)]="ano" [ngModelOptions]="{ standalone: true }"
                class="min-h-11 rounded-xl border border-brand-light bg-white px-3 py-2.5 text-brand-dark focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand" />
        </div>

        <button type="button" [disabled]="carregando" (click)="aplicarMensal()" aria-label="Filtrar por mês e ano"
            class="min-h-11 rounded-xl border border-brand px-4 py-2 text-sm font-semibold text-brand-dark transition hover:bg-brand-light/35 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand disabled:cursor-not-allowed disabled:opacity-70 lg:w-auto">
            Filtrar mês
        </button>

        <button type="button" [disabled]="carregando" (click)="limparFiltros()"
            class="min-h-11 rounded-xl border border-brand-light px-4 py-2 text-sm font-semibold text-brand-dark transition hover:bg-brand-light/25 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand disabled:cursor-not-allowed disabled:opacity-70 lg:w-auto">
            Limpar
        </button>
    </div>
</section>
