<section aria-labelledby="titulo-transacoes"
    class="mx-auto w-full max-w-6xl rounded-2xl border border-brand-light/50 bg-gradient-to-b from-brand-light/20 to-white p-6 shadow-[0_10px_35px_rgba(53,88,114,0.10)]">
    <header class="mb-6 flex flex-wrap items-end justify-between gap-3">
        <div class="grid gap-1">
            <h1 id="titulo-transacoes" class="text-2xl font-bold text-brand-dark">Transacoes</h1>
            <p class="text-sm text-brand-dark/75">Cadastre, edite, filtre e acompanhe seus lancamentos.</p>
        </div>

        <span
            class="rounded-xl border border-brand-light bg-background px-3 py-2 text-sm font-semibold text-brand-dark">
            Total: {{ totalTransacoes() }}
        </span>
    </header>

    <app-filtros-transacoes [carregando]="carregando()"
        (filtrarPeriodo)="aplicarFiltroPeriodo($event.dataInicio, $event.dataFim)"
        (filtrarMensal)="aplicarFiltroMensal($event.mes, $event.ano)" (limpar)="limparFiltros()" />

    <form [formGroup]="formulario" (ngSubmit)="onSubmit()" novalidate class="mt-6 grid gap-4">
        <div class="grid gap-4 md:grid-cols-2">
            <app-input-formulario id="descricao" rotulo="Descricao" ajuda="Descreva o lancamento em ate 180 caracteres."
                [invalido]="campoInvalido('descricao')" [controle]="formulario.controls.descricao" [mensagensErro]="{
					required: 'Descricao e obrigatoria.',
					maxlength: 'Descricao deve ter no maximo 180 caracteres.'
				}" />

            <app-input-formulario id="categoria" rotulo="Categoria" ajuda="Categoria com no maximo 100 caracteres."
                [invalido]="campoInvalido('categoria')" [controle]="formulario.controls.categoria" [mensagensErro]="{
					required: 'Categoria e obrigatoria.',
					maxlength: 'Categoria deve ter no maximo 100 caracteres.'
				}" />

            <app-input-formulario id="valor" rotulo="Valor" tipo="number" ajuda="Use valor maior que zero."
                [invalido]="campoInvalido('valor')" [controle]="formulario.controls.valor" [mensagensErro]="{
					required: 'Valor e obrigatorio.',
					min: 'Valor deve ser maior que zero.'
				}" />

            <app-input-formulario id="data" rotulo="Data" tipo="date" [invalido]="campoInvalido('data')"
                [controle]="formulario.controls.data" [mensagensErro]="{ required: 'Data e obrigatoria.' }" />
        </div>

        <div class="grid gap-1.5">
            <label for="tipo" class="text-sm font-semibold text-brand-dark">Tipo</label>
            <select id="tipo" formControlName="tipo"
                class="min-h-11 rounded-xl border border-brand-light bg-white px-3 py-2.5 text-brand-dark transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand">
                <option value="">Selecione</option>
                <option value="RECEITA">Receita</option>
                <option value="DESPESA">Despesa</option>
            </select>

            @if (campoInvalido('tipo') === 'true') {
            <p class="m-0 text-xs font-semibold text-error" role="alert">Tipo e obrigatorio.</p>
            }
        </div>

        <div class="flex flex-wrap gap-3">
            <app-botao-submit rotuloPadrao="Salvar transacao" rotuloCarregando="Salvando..." [carregando]="carregando()"
                [desabilitado]="formulario.invalid" />
        </div>
    </form>

    @if (temMensagemSucesso()) {
    <p class="mt-4 rounded-xl border border-success/30 bg-success/10 px-3 py-2 text-sm font-semibold text-success"
        role="status" aria-live="polite">
        {{ mensagemSucesso() }}
    </p>
    }

    @if (temMensagemErro()) {
    <p class="mt-4 rounded-xl border border-error/30 bg-error/10 px-3 py-2 text-sm font-semibold text-error"
        role="alert" aria-live="assertive">
        {{ mensagemErro() }}
    </p>
    }

    <app-lista-transacoes class="mt-6" [transacoes]="transacoes()" [carregando]="carregando()"
        [idEmEdicao]="transacaoEmEdicaoId()" (editar)="editarTransacao($event)" (excluir)="excluirTransacao($event)" />
</section>
